[project]
name = "discord-bot"
version = "0.1.0"
description = "A small Python starter for a Discord bot with slash commands."
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.7,<3.0",
    "google-genai>=2.33.0,<3.0",
]

[project.scripts]
discord-bot = "discord_bot.bot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
